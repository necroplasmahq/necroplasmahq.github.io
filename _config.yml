title: "Necroplasma"
description: "Quadrinhos, personagens, publicações e curiosidades do universo Spawn."

google_site_verification: google-site-verification=CPjR4AdrsuGs3C2ipnZfP4ZYq5c1OTC4nFouC0LZ9lI

lang: pt-BR
locale: pt_BR

url: "https://necroplasmahq.github.io"
baseurl: ""

timezone: America/Recife

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

social:
  name: "Necroplasma"
  links:
    - "https://www.instagram.com/necroplasmahq/"
    - "https://www.facebook.com/necroplasmahq/"

twitter:
  username: "necroplasmahq"
  card: summary_large_image

collections:
  arcos:
    output: true
    permalink: /historias/arcos/:name/
  edicoes:
    output: true
    permalink: /historias/edicoes/:name/
  publicacoes:
    output: true
    permalink: /historias/publicacoes/:name/
  personagens:
    output: true
    permalink: /personagens/:name/
  criadores:
    output: true
    permalink: /criadores/:name/

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/social-default.webp
        width: 1200
        height: 630
        alt: "Necroplasma, blog sobre o universo Spawn."

  - scope:
      path: ""
      type: arcos
    values:
      layout: arco

  - scope:
      path: ""
      type: edicoes
    values:
      layout: edicao

  - scope:
      path: ""
      type: publicacoes
    values:
      layout: publicacao

  - scope:
      path: ""
      type: personagens
    values:
      layout: personagem

  - scope:
      path: ""
      type: criadores
    values:
      layout: criador