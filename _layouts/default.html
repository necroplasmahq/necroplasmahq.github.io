<!DOCTYPE html>
<html lang="{{ site.lang | default: 'pt-BR' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml"
        title="{{ site.title | escape }}"
        href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#conteudo">
    Pular para o conteúdo
  </a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="site-brand" href="{{ '/' | relative_url }}"
         aria-label="Necroplasma, página inicial">
        <span class="site-brand__name">Necroplasma</span>
        <span class="site-brand__subtitle">O universo de Spawn</span>
      </a>

      <nav class="site-nav" aria-label="Navegação principal">
        <a href="{{ '/' | relative_url }}"
           {% if page.url == '/' %}aria-current="page"{% endif %}>
          Início
        </a>
        <a href="{{ '/historias/' | relative_url }}"
           {% if page.url contains '/historias/' %}aria-current="page"{% endif %}>
          Histórias
        </a>
        <a href="{{ '/personagens/' | relative_url }}"
           {% if page.url contains '/personagens/' %}aria-current="page"{% endif %}>
          Personagens
        </a>
        <a href="{{ '/arquivo/' | relative_url }}"
           {% if page.url contains '/arquivo/' %}aria-current="page"{% endif %}>
          Arquivo
        </a>
        <a href="{{ '/sobre/' | relative_url }}"
           {% if page.url contains '/sobre/' %}aria-current="page"{% endif %}>
          Sobre
        </a>
      </nav>
    </div>
  </header>

  <main id="conteudo">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ 'now' | date: '%Y' }} Necroplasma.</p>
      <p>
        Projeto independente de fã, sem vínculo oficial com
        Todd McFarlane ou Image Comics.
      </p>
    </div>
  </footer>
</body>
</html>
